name: Booking quality

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booking-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTENV_CONFIG_PATH: /dev/null
      CHECKOUT_RECOVERY: 'false'
      APP_ENV: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Isolated checkout integration
        run: npm run test:checkout:sandbox
      - name: Full regression suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: synthetic-ci-tests-only
      - name: TypeScript
        run: npm run check
      - name: Production build without operational credentials
        run: npm run build
